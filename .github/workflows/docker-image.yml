name: Docker Image CI

on:
  push:
    branches: [ "5.x-dev" ]
  pull_request:
    branches: [ "5.x-dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build . --file Containerfile --tag ath88-matomo-plugin-extratools:$(date +%s)
